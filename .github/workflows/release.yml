# Tag-based release: beta/v* → prerelease, v* (from main only) → full release.
# APK is built and uploaded to GitHub Release. Signing uses keystore from secrets if set;
# otherwise the app's debug keystore fallback is used (fine for beta).

name: Release

on:
  push:
    tags:
      - 'beta/v*'
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce full release only from main
        if: "!startsWith(github.ref, 'refs/tags/beta/')"
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref }}")
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main 2>/dev/null; then
            echo "::error::Full release tags (v*) must be created from main. This tag is not on main."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Determine prerelease flag
        id: prerelease
        run: |
          if [[ "${{ github.ref }}" == refs/tags/beta/v* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          files: builds/app/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
